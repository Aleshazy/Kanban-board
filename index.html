<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Flow Board</h1>
    <div class="auth">
      <button id="loginBtn" class="ghost">Login</button>
      <button id="registerBtn" class="ghost">Register</button>
    </div>
  </header>
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <h2>Kanban board for focused shipping</h2>
        <p class="subtitle">A cleaner concept: task input, selection controls, status changes and a three-column board.</p>
      </div>
      <div class="hero-controls">
        <div class="input-area">
          <input type="text" id="taskInput" placeholder="New task...">
          <button id="addTaskBtn" class="btn-orange-round">+</button>
        </div>
        <div class="actions">
          <button id="selectAllBtn" class="pill">Select all</button>
          <button id="selectUncompletedBtn" class="pill">Uncompleted</button>
          <select id="statusSelect" class="status-select pill">
            <option value="todo">To Do +</option>
            <option value="progress">In Progress +</option>
            <option value="done">Done +</option>
          </select>
          <button id="changeStatusBtn" class="btn-dark">Go</button>
        </div>
      </div>
    </div>
  </section>

  <main class="board-area">
    <div class="board">
      <div class="column" id="todo">
        <div class="col-head"><h2>To Do</h2><span class="count" data-for="todo">0</span></div>
      </div>
      <div class="column" id="progress">
        <div class="col-head"><h2>In Progress</h2><span class="count" data-for="progress">0</span></div>
      </div>
      <div class="column" id="done">
        <div class="col-head"><h2>Done</h2><span class="count" data-for="done">0</span></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
